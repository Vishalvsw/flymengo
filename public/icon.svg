<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1B3D" />
      <stop offset="100%" stop-color="#07152E" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA040" />
      <stop offset="100%" stop-color="#FF6B00" />
    </linearGradient>
  </defs>
  <!-- Background with safe zone padding -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Subtle globe latitude lines in background -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#1E3A8A" stroke-width="6" opacity="0.4" />
  <ellipse cx="256" cy="256" rx="90" ry="160" fill="none" stroke="#1E3A8A" stroke-width="6" opacity="0.4" />
  <line x1="96" y1="256" x2="416" y2="256" stroke="#1E3A8A" stroke-width="6" opacity="0.4" />
  
  <!-- Flight contrail arc -->
  <path d="M 120 380 Q 200 320 270 240" fill="none" stroke="#FF9E40" stroke-width="8" stroke-dasharray="12 8" opacity="0.8" />
  
  <!-- Center Airplane Icon -->
  <g transform="translate(256, 256) rotate(-35) translate(-100, -100)">
    <path d="M100 10 L125 70 L200 85 L125 110 L140 170 L100 145 L60 170 L75 110 L0 85 L75 70 Z" fill="url(#orangeGrad)" filter="drop-shadow(0px 8px 16px rgba(0,0,0,0.4))" />
  </g>
  
  <!-- Star Sparkle -->
  <circle cx="370" cy="130" r="14" fill="#FBBF24" />
  <path d="M370 110 L370 150 M350 130 L390 130" stroke="#FBBF24" stroke-width="4" stroke-linecap="round" />
</svg>
